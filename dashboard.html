<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="English Time - Kişisel ilerleme paneli">
  <title>English Time | Panelim</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>

  <div class="bg-effects">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="stars"></div>

  <div class="container">

    <!-- User Bar -->
    <div class="user-bar" id="user-bar"></div>

    <div class="brand" style="margin-bottom: 24px;">
      <span class="brand-icon">📊</span>
      <h1>Panelim</h1>
      <p id="dash-subtitle">İlerleme durumun</p>
    </div>

    <!-- Loading -->
    <div id="dash-loading" style="color: var(--text-muted); text-align: center;">Yükleniyor...</div>

    <!-- Dashboard Content (hidden until loaded) -->
    <div id="dash-content" style="display: none; width: 100%; max-width: 700px;">

      <!-- Overall Stats -->
      <div class="results-grid" style="margin-bottom: 24px;">
        <div class="result-card card-first">
          <span class="result-icon">⚡</span>
          <span class="result-value" id="dash-first">0</span>
          <span class="result-label">İlk Seferde</span>
        </div>
        <div class="result-card card-retry">
          <span class="result-icon">🔄</span>
          <span class="result-value" id="dash-retry">0</span>
          <span class="result-label">Tekrarda</span>
        </div>
        <div class="result-card card-hard">
          <span class="result-icon">😓</span>
          <span class="result-value" id="dash-hard">0</span>
          <span class="result-label">Yapılamayan</span>
        </div>
        <div class="result-card card-unknown">
          <span class="result-icon">❌</span>
          <span class="result-value" id="dash-unknown">0</span>
          <span class="result-label">Bilinmiyor</span>
        </div>
      </div>

      <!-- Study Words Section -->
      <div class="word-list-section wl-unknown" id="study-section" style="margin-bottom: 24px; display: none;">
        <div class="word-list-header" id="study-header">
          <div class="word-list-title">
            <span class="word-list-icon">📖</span>
            <span>Çalışılması Gereken Kelimeler</span>
            <span class="word-list-count" id="study-count">0</span>
          </div>
          <span class="word-list-toggle">▼</span>
        </div>
        <div class="word-list-body" id="study-body"></div>
      </div>

      <!-- Past Sessions -->
      <div class="word-list-section wl-retry" id="sessions-section" style="margin-bottom: 24px; display: none;">
        <div class="word-list-header" id="sessions-header">
          <div class="word-list-title">
            <span class="word-list-icon">📋</span>
            <span>Geçmiş Oturumlar</span>
            <span class="word-list-count" id="sessions-count">0</span>
          </div>
          <span class="word-list-toggle">▼</span>
        </div>
        <div class="word-list-body" id="sessions-body"></div>
      </div>

      <!-- Actions -->
      <div class="results-actions" style="margin-top: 16px;">
        <a href="index.html" class="btn-primary">▶ Yeni Quiz Başlat</a>
        <a href="study.html" class="btn-secondary" id="study-link" style="display: none;">📖 Kelime Çalış</a>
      </div>

    </div>

    <!-- Not Logged In -->
    <div id="dash-no-login" style="display: none; text-align: center;">
      <p style="color: var(--text-secondary); margin-bottom: 20px;">İlerlemenizi görmek için giriş yapmalısınız.</p>
      <a href="login.html" class="btn-primary">🔑 Giriş Yap</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/words-a2.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getCurrentUser();
      document.getElementById('dash-loading').style.display = 'none';

      if (!user || !user.id) {
        document.getElementById('dash-no-login').style.display = 'block';
        return;
      }

      document.getElementById('dash-subtitle').textContent = `Hoş geldin, ${user.username}!`;
      document.getElementById('dash-content').style.display = 'block';

      const sb = getSupabase();

      // Fetch overall word results
      const { data: wordResults } = await sb
        .from('word_results').select('*').eq('user_id', user.id);

      if (wordResults && wordResults.length > 0) {
        // Count unique words by best result
        const bestResults = {};
        wordResults.forEach(wr => {
          const key = wr.word_id;
          const priority = { first_try: 1, retry: 2, hard: 3, unknown: 4 };
          if (!bestResults[key] || priority[wr.result] < priority[bestResults[key]]) {
            bestResults[key] = wr.result;
          }
        });

        let first = 0, retry = 0, hard = 0, unknown = 0;
        Object.values(bestResults).forEach(r => {
          if (r === 'first_try') first++;
          else if (r === 'retry') retry++;
          else if (r === 'hard') hard++;
          else if (r === 'unknown') unknown++;
        });

        document.getElementById('dash-first').textContent = first;
        document.getElementById('dash-retry').textContent = retry;
        document.getElementById('dash-hard').textContent = hard;
        document.getElementById('dash-unknown').textContent = unknown;
      }

      // Fetch study words
      const { data: studyWords } = await sb
        .from('study_words').select('*').eq('user_id', user.id).eq('mastered', false);

      if (studyWords && studyWords.length > 0) {
        document.getElementById('study-section').style.display = 'block';
        document.getElementById('study-count').textContent = studyWords.length;
        document.getElementById('study-link').style.display = 'inline-flex';

        const body = document.getElementById('study-body');
        studyWords.forEach(sw => {
          const word = WORDS_A2.find(w => w.id === sw.word_id);
          if (!word) return;
          const row = document.createElement('div');
          row.className = 'word-list-row';
          row.innerHTML = `
            <span class="word-en">${word.en}</span>
            <span class="word-separator">—</span>
            <span class="word-tr">${word.tr}</span>
          `;
          body.appendChild(row);
        });

        // Toggle
        document.getElementById('study-header').addEventListener('click', () => {
          body.classList.toggle('collapsed');
          document.querySelector('#study-header .word-list-toggle').textContent =
            body.classList.contains('collapsed') ? '▶' : '▼';
        });
      }

      // Fetch sessions
      const { data: sessions } = await sb
        .from('quiz_sessions').select('*').eq('user_id', user.id)
        .eq('status', 'completed').order('completed_at', { ascending: false }).limit(10);

      if (sessions && sessions.length > 0) {
        document.getElementById('sessions-section').style.display = 'block';
        document.getElementById('sessions-count').textContent = sessions.length;

        const body = document.getElementById('sessions-body');
        sessions.forEach(s => {
          const total = s.first_try_count + s.retry_count + s.hard_count + s.unknown_count;
          const date = new Date(s.completed_at).toLocaleDateString('tr-TR', {
            day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
          });
          const modeText = s.mode === 'en-tr' ? 'EN→TR' : 'TR→EN';
          const row = document.createElement('div');
          row.className = 'word-list-row';
          row.style.justifyContent = 'space-between';
          row.innerHTML = `
            <span style="font-weight:600; color: var(--text-primary);">${date}</span>
            <span style="color: var(--text-muted); font-size: 0.8rem;">${modeText} · ${total} kelime ·
              ⚡${s.first_try_count} 🔄${s.retry_count} 😓${s.hard_count} ❌${s.unknown_count}</span>
          `;
          body.appendChild(row);
        });

        // Toggle
        document.getElementById('sessions-header').addEventListener('click', () => {
          body.classList.toggle('collapsed');
          document.querySelector('#sessions-header .word-list-toggle').textContent =
            body.classList.contains('collapsed') ? '▶' : '▼';
        });
      }
    });
  </script>
</body>
</html>
