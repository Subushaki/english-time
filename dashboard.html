<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="English Time - Kişisel ilerleme paneli">
  <title>English Time | Panelim</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    /* Turn result cards into clickable buttons with hover effects */
    .result-card {
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      cursor: pointer;
    }
    .result-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      filter: brightness(1.1);
    }
  </style>
  <!-- Preconnect & Network Observer -->
  <link rel="preconnect" href="https://oumhweoxhzziufhasxch.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://oumhweoxhzziufhasxch.supabase.co">
  <script src="js/optimize.js"></script>

  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/theme-light.css">
</head>
<body>

  <div class="bg-effects">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="stars"></div>

  <div class="container">

    <div class="user-bar" id="user-bar"></div>

    <div id="dash-loading" style="color: var(--text-muted); text-align: center; margin-top: 40px;">Yükleniyor...</div>

    <!-- Dashboard Content -->
    <div id="dash-content" style="display: none; width: 100%; max-width: 700px; padding-top: 20px;">

      <!-- Overall Stats Grid as Navigation Buttons -->
      <div class="results-grid" style="margin-bottom: 24px;">
        <a href="category.html?type=first_try" class="result-card card-first">
          <span class="result-icon">⚡</span>
          <span class="result-value" id="dash-first">0</span>
          <span class="result-label">İlk Seferde</span>
        </a>
        <a href="category.html?type=retry" class="result-card card-retry">
          <span class="result-icon">🔄</span>
          <span class="result-value" id="dash-retry">0</span>
          <span class="result-label">Tekrarda</span>
        </a>
        <a href="category.html?type=hard" class="result-card card-hard">
          <span class="result-icon">😓</span>
          <span class="result-value" id="dash-hard">0</span>
          <span class="result-label">Yapılamayan</span>
        </a>
        <a href="category.html?type=unknown" class="result-card card-unknown">
          <span class="result-icon">❌</span>
          <span class="result-value" id="dash-unknown">0</span>
          <span class="result-label">Bilinmiyor</span>
        </a>
      </div>

      <a href="category.html?type=starred" class="result-card" style="margin-bottom: 24px; padding: 16px; border-color: #fbbf24; background: rgba(251, 191, 36, 0.05); flex-direction: row; gap: 16px;">
        <span style="font-size: 2.5rem;">⭐</span>
        <div style="display: flex; flex-direction: column; align-items: flex-start;">
          <span style="font-size: 1.4rem; font-weight: 700; color: #fbbf24;" id="dash-starred">0</span>
          <span style="font-size: 0.95rem; color: var(--text-secondary); font-weight: 600;">Yıldızlanan Kelimeler</span>
        </div>
      </a>

      <!-- Actions -->
      <div class="results-actions" style="margin-top: 30px;">
        <a href="index.html" class="btn-primary">▶ Yeni Tam Quiz</a>
      </div>

    </div>

    <!-- Not Logged In -->
    <div id="dash-no-login" style="display: none; text-align: center; margin-top: 40px;">
      <p style="color: var(--text-secondary); margin-bottom: 20px;">İlerlemenizi görmek için giriş yapmalısınız.</p>
      <a href="login.html" class="btn-primary">🔑 Giriş Yap</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getCurrentUser();
      document.getElementById('dash-loading').style.display = 'none';

      if (!user || !user.id) {
        document.getElementById('dash-no-login').style.display = 'block';
        return;
      }

      document.getElementById('dash-content').style.display = 'block';

      const sb = getSupabase();

      // FETCH USING PROMISE.ALL FOR X2 NETWORK SPEED
      const [
        { data: wordResults },
        { data: studyWords }
      ] = await Promise.all([
        sb.from('word_results').select('word_id, result').eq('user_id', user.id),
        sb.from('study_words').select('word_id, starred').eq('user_id', user.id)
      ]);

      let starredCount = 0;
      if (studyWords) {
        studyWords.forEach(sw => {
          if (sw.starred) starredCount++;
        });
      }
      document.getElementById('dash-starred').textContent = starredCount;

      // Build best results map
      const bestResults = {};
      if (wordResults && wordResults.length > 0) {
        wordResults.forEach(wr => {
          const priority = { first_try: 1, retry: 2, hard: 3, unknown: 4 };
          if (!bestResults[wr.word_id] || priority[wr.result] < priority[bestResults[wr.word_id]]) {
            bestResults[wr.word_id] = wr.result;
          }
        });
      }

      // Count stats
      let first = 0, retry = 0, hard = 0, unknown = 0;
      Object.values(bestResults).forEach(r => {
        if (r === 'first_try') first++;
        else if (r === 'retry') retry++;
        else if (r === 'hard') hard++;
        else if (r === 'unknown') unknown++;
      });

      document.getElementById('dash-first').textContent = first;
      document.getElementById('dash-retry').textContent = retry;
      document.getElementById('dash-hard').textContent = hard;
      document.getElementById('dash-unknown').textContent = unknown;
      
    });
  </script>
</body>
</html>
