<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="English Time - Giriş yap veya hesap oluştur">
  <title>English Time | Giriş</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <!-- Preconnect & Network Observer -->
  <link rel="preconnect" href="https://oumhweoxhzziufhasxch.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://oumhweoxhzziufhasxch.supabase.co">
  <script src="js/optimize.js"></script>

  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/theme-light.css">
  <!-- PWA & Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a1a">
  <script src="js/offline-sync.js"></script>
</head>
<body>

  <div class="bg-effects">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="stars"></div>

  <div class="container">

    <!-- User Bar -->
    <div class="user-bar" id="user-bar"></div>

    <div class="brand" style="margin-bottom: 30px;">
      <span class="brand-icon">🔑</span>
      <h1>Giriş Yap</h1>
      <p>İlerlemenizi kaydetmek için hesap oluşturun</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-card" id="auth-card">
      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Giriş Yap</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Kayıt Ol</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="form-login" onsubmit="handleLogin(event)">
        <div class="auth-field">
          <label for="login-username">Kullanıcı Adı</label>
          <input type="text" id="login-username" placeholder="Kullanıcı adınızı yazın" autocomplete="username" required>
        </div>
        <div class="auth-field">
          <label for="login-password">Şifre</label>
          <input type="password" id="login-password" placeholder="Şifrenizi yazın" autocomplete="current-password" required>
        </div>
        <div class="auth-error" id="login-error"></div>
        <button type="submit" class="btn-primary auth-submit" id="login-submit">
          Giriş Yap →
        </button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="form-register" style="display: none;" onsubmit="handleRegister(event)">
        <div class="auth-field">
          <label for="reg-username">Kullanıcı Adı</label>
          <input type="text" id="reg-username" placeholder="Bir kullanıcı adı seçin" autocomplete="username" required minlength="3">
        </div>
        <div class="auth-field">
          <label for="reg-password">Şifre</label>
          <input type="password" id="reg-password" placeholder="Şifre belirleyin (min 6 karakter)" autocomplete="new-password" required minlength="6">
        </div>
        <div class="auth-field">
          <label for="reg-password2">Şifre Tekrar</label>
          <input type="password" id="reg-password2" placeholder="Şifrenizi tekrar yazın" autocomplete="new-password" required minlength="6">
        </div>
        <div class="auth-error" id="register-error"></div>
        <button type="submit" class="btn-primary auth-submit" id="register-submit">
          Hesap Oluştur ✓
        </button>
      </form>
    </div>

    <!-- Skip login -->
    <a href="index.html" class="skip-login">Kayıt olmadan devam et →</a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Tab switching
    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('form-login').style.display = tab === 'login' ? 'flex' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'flex' : 'none';
      // Clear errors
      document.getElementById('login-error').textContent = '';
      document.getElementById('register-error').textContent = '';
    }

    // Login handler
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-submit');
      const errEl = document.getElementById('login-error');
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor...';

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      const { error } = await loginUser(username, password);
      if (error) {
        errEl.textContent = error.message;
        btn.disabled = false;
        btn.textContent = 'Giriş Yap →';
      } else {
        window.location.href = 'index.html';
      }
    }

    // Register handler
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('register-submit');
      const errEl = document.getElementById('register-error');
      errEl.textContent = '';

      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const password2 = document.getElementById('reg-password2').value;

      if (password !== password2) {
        errEl.textContent = 'Şifreler eşleşmiyor!';
        return;
      }

      if (username.length < 3) {
        errEl.textContent = 'Kullanıcı adı en az 3 karakter olmalı';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Hesap oluşturuluyor...';

      const { error } = await registerUser(username, password);
      if (error) {
        errEl.textContent = error.message;
        btn.disabled = false;
        btn.textContent = 'Hesap Oluştur ✓';
      } else {
        window.location.href = 'index.html';
      }
    }

    // If already logged in, redirect
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getCurrentUser();
      if (user && user.username) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
